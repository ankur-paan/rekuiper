<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <filter id="dagShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <marker id="mBlue" markerWidth="8" markerHeight="8" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#38bdf8" />
    </marker>
    <marker id="mIndigo" markerWidth="8" markerHeight="8" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#818cf8" />
    </marker>
    <marker id="mOrange" markerWidth="8" markerHeight="8" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#fb923c" />
    </marker>
    <marker id="mGreen" markerWidth="8" markerHeight="8" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#34d399" />
    </marker>
  </defs>

  <style>
    .t1 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #f8fafc; }
    .t2 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94a3b8; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="936" height="216" rx="14" fill="url(#bgDag)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Stage 1: Source Node -->
  <g transform="translate(30, 36)">
    <rect x="0" y="0" width="142" height="144" rx="10" fill="url(#cardBg)" stroke="#0284c7" stroke-width="1.5" filter="url(#dagShadow)" />
    <rect x="12" y="12" width="52" height="20" rx="4" fill="#0369a1" />
    <text x="38" y="26" fill="#e0f2fe" text-anchor="middle" class="mono">STAGE 1</text>
    <text x="12" y="58" class="t1">Source Node</text>
    <text x="12" y="78" class="t2">MQTT, HTTP, WS</text>
    <text x="12" y="96" class="t2">Kafka, Redis, File</text>
    <line x1="12" y1="112" x2="130" y2="112" stroke="#334155" stroke-width="1" />
    <text x="12" y="128" fill="#38bdf8" class="mono">Async Ingestion</text>
  </g>

  <!-- Flow 1 -> 2 (Prominent 40px tail) -->
  <line x1="172" y1="108" x2="214" y2="108" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#mBlue)" />

  <!-- Stage 2: Tokio Channel -->
  <g transform="translate(220, 36)">
    <rect x="0" y="0" width="142" height="144" rx="10" fill="url(#cardBg)" stroke="#6366f1" stroke-width="1.5" filter="url(#dagShadow)" />
    <rect x="12" y="12" width="52" height="20" rx="4" fill="#4338ca" />
    <text x="38" y="26" fill="#e0e7ff" text-anchor="middle" class="mono">BUFFER</text>
    <text x="12" y="58" class="t1">Tokio Channel</text>
    <text x="12" y="78" class="t2">Bounded MPSC</text>
    <text x="12" y="96" class="t2">Backpressure safe</text>
    <line x1="12" y1="112" x2="130" y2="112" stroke="#334155" stroke-width="1" />
    <text x="12" y="128" fill="#a5b4fc" class="mono">Capacity: 1024</text>
  </g>

  <!-- Flow 2 -> 3 (Prominent 40px tail) -->
  <line x1="362" y1="108" x2="404" y2="108" stroke="#818cf8" stroke-width="2.5" marker-end="url(#mIndigo)" />

  <!-- Stage 3: Filter & Transform -->
  <g transform="translate(410, 36)">
    <rect x="0" y="0" width="146" height="144" rx="10" fill="url(#cardBg)" stroke="#f97316" stroke-width="1.5" filter="url(#dagShadow)" />
    <rect x="12" y="12" width="52" height="20" rx="4" fill="#c2410c" />
    <text x="38" y="26" fill="#ffedd5" text-anchor="middle" class="mono">STAGE 2</text>
    <text x="12" y="58" class="t1">Filter &amp; Transform</text>
    <text x="12" y="78" class="t2">rekuiper-sql AST</text>
    <text x="12" y="96" class="t2">Scalar functions</text>
    <line x1="12" y1="112" x2="134" y2="112" stroke="#334155" stroke-width="1" />
    <text x="12" y="128" fill="#fb923c" class="mono">Zero-Copy Filter</text>
  </g>

  <!-- Flow 3 -> 4 (Prominent 40px tail) -->
  <line x1="556" y1="108" x2="598" y2="108" stroke="#fb923c" stroke-width="2.5" marker-end="url(#mOrange)" />

  <!-- Stage 4: Window State -->
  <g transform="translate(604, 36)">
    <rect x="0" y="0" width="146" height="144" rx="10" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.5" filter="url(#dagShadow)" />
    <rect x="12" y="12" width="52" height="20" rx="4" fill="#b45309" />
    <text x="38" y="26" fill="#fef3c7" text-anchor="middle" class="mono">STAGE 3</text>
    <text x="12" y="58" class="t1">Window Engine</text>
    <text x="12" y="78" class="t2">Tumbling, Sliding</text>
    <text x="12" y="96" class="t2">Session &amp; Count</text>
    <line x1="12" y1="112" x2="134" y2="112" stroke="#334155" stroke-width="1" />
    <text x="12" y="128" fill="#fcd34d" class="mono">State Accumulator</text>
  </g>

  <!-- Flow 4 -> 5 (Prominent 40px tail) -->
  <line x1="750" y1="108" x2="792" y2="108" stroke="#34d399" stroke-width="2.5" marker-end="url(#mGreen)" />

  <!-- Stage 5: Sink Node -->
  <g transform="translate(798, 36)">
    <rect x="0" y="0" width="114" height="144" rx="10" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5" filter="url(#dagShadow)" />
    <rect x="12" y="12" width="52" height="20" rx="4" fill="#047857" />
    <text x="38" y="26" fill="#d1fae5" text-anchor="middle" class="mono">STAGE 4</text>
    <text x="12" y="58" class="t1">Sink Node</text>
    <text x="12" y="78" class="t2">Log, MQTT</text>
    <text x="12" y="96" class="t2">DB, REST</text>
    <line x1="12" y1="112" x2="102" y2="112" stroke="#334155" stroke-width="1" />
    <text x="12" y="128" fill="#34d399" class="mono">Egress Action</text>
  </g>
</svg>
