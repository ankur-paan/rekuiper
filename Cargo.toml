[workspace]
members = [
    "crates/rekuiper-core",
    "crates/rekuiper-sql",
    "crates/rekuiper-conf",
    "crates/rekuiper-connectors",
    "crates/rekuiper-server",
    "crates/rekuiper-cli",
    "crates/kuiperd",
]
resolver = "2"

[workspace.package]
version = "0.420.0-beta"
edition = "2021"
authors = ["I-Dacs Labs <measure@i-dacs.com>", "LF Edge eKuiper Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ankur-paan/rekuiper"
homepage = "https://i-dacs.com"
documentation = "https://docs.ekuiper.org"
readme = "README.md"
keywords = ["iot", "stream-processing", "edge-computing", "sql", "mqtt"]
categories = ["embedded", "network-programming", "science"]


[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.30"
regex = "1.10"
parking_lot = "0.12"
futures = "0.3"
rumqttc = "0.24"
tokio-tungstenite = "0.23"
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "aio"] }
rskafka = "0.6"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres"] }
base64 = "0.22"

# Internal crate dependencies
rekuiper-core = { path = "crates/rekuiper-core" }
rekuiper-sql = { path = "crates/rekuiper-sql" }
rekuiper-conf = { path = "crates/rekuiper-conf" }
rekuiper-connectors = { path = "crates/rekuiper-connectors" }
rekuiper-server = { path = "crates/rekuiper-server" }
