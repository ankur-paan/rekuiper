name: Release Builds & Assets

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.423-beta)'
        required: false
        default: 'v0.501-beta'

permissions:
  contents: write

jobs:
  gate-checks:
    name: Mandatory Release Gates & Real-Broker Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository at exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify Tag Resolves to Exact Tested Revision
        shell: bash
        run: |
          TARGET_REF="${{ inputs.tag || github.ref }}"
          echo "Target reference: ${TARGET_REF}"
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "Checked out commit: ${CURRENT_COMMIT}"
          if [ -n "${{ inputs.tag }}" ]; then
            TAG_COMMIT=$(git rev-parse -q --verify "refs/tags/${{ inputs.tag }}^{commit}" || git rev-parse -q --verify "${{ inputs.tag }}^{commit}" || true)
            if [ -n "$TAG_COMMIT" ] && [ "$TAG_COMMIT" != "$CURRENT_COMMIT" ]; then
              echo "Error: Checked out commit ($CURRENT_COMMIT) does not match requested tag commit ($TAG_COMMIT)!"
              exit 1
            fi
          fi

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Formatting & Lint Checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace Tests
        run: cargo test --workspace

      - name: Provision Isolated Mosquitto Broker (Plaintext & TLS)
        run: |
          mkdir -p /tmp/mosquitto_cfg
          cp crates/rekuiper-connectors/tests/tls_fixtures/ca1.crt /tmp/mosquitto_cfg/
          cp crates/rekuiper-connectors/tests/tls_fixtures/server_localhost.crt /tmp/mosquitto_cfg/
          cp crates/rekuiper-connectors/tests/tls_fixtures/server_localhost.key /tmp/mosquitto_cfg/
          chmod 644 /tmp/mosquitto_cfg/*
          cat << 'EOF' > /tmp/mosquitto_cfg/mosquitto.conf
          listener 1883
          allow_anonymous true

          listener 8883
          allow_anonymous true
          cafile /mosquitto/config/ca1.crt
          certfile /mosquitto/config/server_localhost.crt
          keyfile /mosquitto/config/server_localhost.key
          EOF
          docker run -d --name mosquitto-release-broker \
            -p 1883:1883 -p 8883:8883 \
            -v /tmp/mosquitto_cfg:/mosquitto/config \
            eclipse-mosquitto:2
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 1883 && nc -z 127.0.0.1 8883; then
              echo "Mosquitto broker ready on 1883 and 8883"
              break
            fi
            sleep 1
          done

      - name: Run Required Real-Broker Integration Tests
        env:
          REKUIPER_REQUIRE_MQTT: "1"
          REKUIPER_REQUIRE_BROKER: "1"
          REKUIPER_REQUIRE_MQTT_TLS: "1"
          REKUIPER_TEST_MQTT: "tcp://127.0.0.1:1883"
          REKUIPER_TEST_MQTT_TLS: "ssl://127.0.0.1:8883"
          REKUIPER_TEST_MQTT_CA: "${{ github.workspace }}/crates/rekuiper-connectors/tests/tls_fixtures/ca1.crt"
        run: |
          cargo test -p rekuiper-connectors --test test_mqtt_tls -- --nocapture
          cargo test -p rekuiper-server --test iiot_mqtt -- --nocapture

      - name: Teardown Isolated Broker
        if: always()
        run: |
          docker rm -f mosquitto-release-broker || true
          rm -rf /tmp/mosquitto_cfg

  build-release:
    name: Build (${{ matrix.target }})
    needs: gate-checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Release Assets
        shell: bash
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          PKG_NAME="rekuiper-${TAG_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${PKG_NAME}/bin" "dist/${PKG_NAME}/etc"

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp "target/${{ matrix.target }}/release/kuiperd.exe" "dist/${PKG_NAME}/bin/"
            cp "target/${{ matrix.target }}/release/kuiper.exe" "dist/${PKG_NAME}/bin/"
            cp -r etc/* "dist/${PKG_NAME}/etc/"
            cp LICENSE README.md RELEASE_NOTES.md "dist/${PKG_NAME}/"
            cd dist
            7z a "${PKG_NAME}.zip" "${PKG_NAME}"
            sha256sum "${PKG_NAME}.zip" > "${PKG_NAME}.zip.sha256"
          else
            cp "target/${{ matrix.target }}/release/kuiperd" "dist/${PKG_NAME}/bin/"
            cp "target/${{ matrix.target }}/release/kuiper" "dist/${PKG_NAME}/bin/"
            cp -r etc/* "dist/${PKG_NAME}/etc/"
            cp LICENSE README.md RELEASE_NOTES.md "dist/${PKG_NAME}/"
            cd dist
            tar -czvf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
            else
              shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
            fi
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: [gate-checks, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-assets-*
          merge-multiple: true

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "rekuiper ${{ inputs.tag || github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
