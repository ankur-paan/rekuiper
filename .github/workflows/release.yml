name: Release Builds & Assets

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.423-beta)'
        required: false
        default: 'v0.424-beta'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Release Assets
        shell: bash
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          PKG_NAME="rekuiper-${TAG_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${PKG_NAME}/bin" "dist/${PKG_NAME}/etc"

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp "target/${{ matrix.target }}/release/kuiperd.exe" "dist/${PKG_NAME}/bin/"
            cp "target/${{ matrix.target }}/release/kuiper.exe" "dist/${PKG_NAME}/bin/"
            cp -r etc/* "dist/${PKG_NAME}/etc/"
            cp LICENSE README.md RELEASE_NOTES.md "dist/${PKG_NAME}/"
            cd dist
            7z a "${PKG_NAME}.zip" "${PKG_NAME}"
            sha256sum "${PKG_NAME}.zip" > "${PKG_NAME}.zip.sha256"
          else
            cp "target/${{ matrix.target }}/release/kuiperd" "dist/${PKG_NAME}/bin/"
            cp "target/${{ matrix.target }}/release/kuiper" "dist/${PKG_NAME}/bin/"
            cp -r etc/* "dist/${PKG_NAME}/etc/"
            cp LICENSE README.md RELEASE_NOTES.md "dist/${PKG_NAME}/"
            cd dist
            tar -czvf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
            else
              shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
            fi
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-assets-*
          merge-multiple: true

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "rekuiper ${{ inputs.tag || github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
