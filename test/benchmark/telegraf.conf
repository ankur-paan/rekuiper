[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 50000
  metric_buffer_limit = 1000000
  quiet = true

[[inputs.file]]
  files = ["/data/telemetry_500k.jsonl"]
  data_format = "json_v2"
  [[inputs.file.json_v2]]
    [[inputs.file.json_v2.field]]
      path = "temp"
      type = "float"
    [[inputs.file.json_v2.tag]]
      path = "id"
      type = "string"

[[outputs.discard]]
