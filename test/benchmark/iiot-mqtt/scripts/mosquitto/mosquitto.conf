# Benchmark broker (eclipse-mosquitto:2). Isolated from the user's EMQX (host 1883): published on host port 11883.
listener 1883 0.0.0.0
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
# Generous limits so the broker does not silently drop QoS0 bursts for a slow subscriber during engine comparisons.
max_queued_messages 1000000
max_queued_bytes 0
max_inflight_messages 0
message_size_limit 0
