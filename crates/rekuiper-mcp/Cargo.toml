[package]
name = "rekuiper-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "High-performance Model Context Protocol (MCP) server providing zero-network AST analysis, in-memory query simulation, and comprehensive edge streaming control plane for rekuiper"

[[bin]]
name = "rekuiper-mcp"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
clap = { workspace = true, features = ["derive"] }
anyhow.workspace = true
reqwest = { workspace = true, features = ["json"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
rekuiper-sql = { path = "../rekuiper-sql" }
